syntax = "proto3";
import "google/protobuf/timestamp.proto";

option go_package = "grpc/pbtodo";

package todos;

message UUID {
    // not supported natively lol
    string value = 1;
}

service TodoService {
    rpc GetAll (GetAllRequest) returns (GetAllResponse) {}
    rpc Put(PutRequest) returns (PutResponse) {}
}

message Todo{
    UUID ID = 1;
    string task = 2;
    google.protobuf.Timestamp due = 3;
}

message GetAllRequest{}

message GetAllResponse{
    repeated Todo todos = 1;
}

message PutRequest{
    Todo todo = 1; // You cannot set the ID.
}

message PutResponse{
    Todo todo = 1;
}
